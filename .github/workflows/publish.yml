# 模块功能：推送 v* 标签时自动用 uv 构建 sdist + wheel 并发布到 PyPI（Trusted Publishing，无需密钥）
# 使用流程：
#   1. 在 PyPI 项目 pycloudrun 的 Settings -> Publishing 添加 Trusted Publisher：
#      owner=youtian95, repository=cloudrun, workflow=publish.yml, environment=pypi
#      （首次发布前项目不存在时，先在 PyPI 账户级 Publishing 页面添加"待定发布"）
#   2. 修改 pyproject.toml 版本号并提交，然后打标签推送：
#      git tag v0.3.8 && git push origin v0.3.8
# 输入：v* 标签（标签号须与 pyproject.toml 的 version 一致）；也可在 Actions 页面手动触发
# 输出：PyPI 上的 pycloudrun 新版本

name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  # 构建并发布（与本地开发同为 uv，产物一致）
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC 可信发布必需：允许 GitHub 签发身份令牌
      contents: read # 检出代码
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple # CI 在海外，覆盖 pyproject 里的阿里云镜像
    steps:
      - uses: actions/checkout@v4

      # 安装 uv 与 Python 3.12，并缓存 uv 下载（setup-uv 自 v8 起不再提供大版本浮动标签，须钉住完整版本号）
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      # 校验标签号与 pyproject.toml 版本号一致，防止发错版本
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "标签 $tag 与 pyproject.toml 版本 $version 不一致" >&2
            exit 1
          fi

      # 打包生成 dist/*.tar.gz 与 dist/*.whl
      - name: Build
        run: uv build

      # 凭 OIDC 令牌上传到 PyPI（--trusted-publishing always：强制走可信发布，无令牌则报错）
      - name: Publish
        run: uv publish --trusted-publishing always